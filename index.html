/* ---------- cache de catálogos ---------- */
const cache = {};
async function catalogo(nombre, force=false){
  if(cache[nombre] && !force) return cache[nombre];
  let q;
  if(nombre==="determinaciones") q = sb.from("determinaciones").select("*").order("orden");
  if(nombre==="tratamientos") q = sb.from("tratamientos").select("*").order("nombre");
  if(nombre==="productos") q = sb.from("v_inventario").select("*").order("nombre");
  const { data, error } = await q; if(error) throw error;
  return cache[nombre] = data;
}

/* ---------- AGENDA DE TURNOS ---------- */
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DIAS_C = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const ESTADOS_T = ["Reservado","Confirmado","Atendido","Ausente","Cancelado"];
const estadoTurnoClase = e => ({"Reservado":"s-info","Confirmado":"s-ok","Atendido":"s-none","Ausente":"s-bad","Cancelado":"s-none"}[e]||"s-none");
const isoDe = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dDe = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const masDias = (iso, n) => { const d = dDe(iso); d.setDate(d.getDate()+n); return isoDe(d); };
const lunesDe = iso => { const d = dDe(iso); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoDe(d); };
const minDe = h => { const [a,b] = h.slice(0,5).split(":").map(Number); return a*60+b; };
const hDe = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
// Selector de horario en formato 24 hs (el campo "time" del iPad muestra AM/PM según la configuración del equipo)
const opcionesHora = (sel, paso=15, desde=6*60, hasta=23*60) => { const L=[]; for(let m=desde; m<=hasta; m+=paso) L.push(hDe(m)); if(sel && !L.includes(sel)) { L.push(sel); L.sort(); }
  return L.map(h=>`<option value="${h}" ${h===sel?"selected":""}>${h} hs</option>`).join(""); };
const fechaLarga = iso => { const d = dDe(iso); return `${DIAS[d.getDay()]} ${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`; };
async function leerConfig(clave, def){ const { data } = await sb.from("config").select("valor").eq("clave", clave).maybeSingle(); return data ? data.valor : def; }
async function configAgenda(){ return await leerConfig("agenda", { duracion:30, dias:{ "1":["09:00","19:00"],"2":["09:00","19:00"],"3":["09:00","19:00"],"4":["09:00","19:00"],"5":["09:00","19:00"] } }); }
function telWhatsApp(tel){
  let d = (tel||"").replace(/\D/g,""); if(!d) return null;
  if(d.startsWith("00")) d = d.slice(2);
  if(d.startsWith("54")){ d = d.slice(2); if(d.startsWith("9")) d = d.slice(1); }
  if(d.startsWith("0")) d = d.slice(1);
  if(d.length === 12){ for(const p of [2,3,4]) if(d.slice(p,p+2)==="15"){ d = d.slice(0,p)+d.slice(p+2); break; } }
  return d.length >= 8 ? "549" + d : null;
}
const linkTurno = t => new URL("turno.html", location.href.split("#")[0]).href.split("?")[0] + "?id=" + t.id;
async function mensajeTurno(t){
  const plantilla = await leerConfig("mensaje_turno", "Hola {nombre}! Te confirmo tu turno con la Dra. Analía Jakowluk el {dia} {fecha} a las {hora} hs.");
  const d = dDe(t.fecha);
  const nombre = (t.paciente||"").split(" ").slice(1).join(" ") || t.paciente || "";
  return plantilla.replaceAll("{nombre}", nombre).replaceAll("{paciente}", t.paciente||"").replaceAll("{dia}", DIAS[d.getDay()].toLowerCase())
    .replaceAll("{fecha}", `${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`).replaceAll("{hora}", t.hora.slice(0,5)).replaceAll("{motivo}", t.motivo||"")
    .replaceAll("{calendario}", t.id ? linkTurno(t) : "")
    .replaceAll("{modalidad}", (t.modalidad||"Presencial").toLowerCase())
    .replaceAll("{enlace}", t.modalidad==="Virtual" && t.enlace ? ` Ingresá desde este enlace: ${t.enlace}.` : "")
    + (!plantilla.includes("{modalidad}") ? ` Modalidad: ${(t.modalidad||"Presencial").toLowerCase()}.` : "")
    + (!plantilla.includes("{enlace}") && t.modalidad==="Virtual" && t.enlace ? ` Enlace: ${t.enlace}` : "")
    + (!plantilla.includes("{calendario}") && t.id ? ` Agregalo a tu calendario (con recordatorio 1 hora antes): ${linkTurno(t)}` : "");
}
async function enviarWhatsApp(t){
  let tel = telWhatsApp(t.telefono);
  if(!tel){ const nuevo = prompt(`No hay celular cargado para ${t.paciente}. Escribilo (con característica, ej. 11 5555-1234):`); if(!nuevo) return;
    tel = telWhatsApp(nuevo); if(!tel) return toast("Ese número no parece válido.");
    await sb.from("pacientes").update({ telefono: nuevo }).eq("id", t.paciente_id); t.telefono = nuevo; }
  const msg = await mensajeTurno(t);
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, "_blank");
  await sb.from("turnos").update({ whatsapp_enviado: new Date().toISOString() }).eq("id", t.id);
}
function icsTurno(t){
  const utc = (f,h,mas=0) => { const [y,m,d]=f.split("-").map(Number), [hh,mm]=h.slice(0,5).split(":").map(Number); return new Date(Date.UTC(y,m-1,d,hh+3,mm+mas)).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); };
  const e = s => (s||"").replace(/[\\;,]/g, m=>"\\"+m).replace(/\n/g,"\\n");
  const txt = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Eternal Secret//Agenda//ES","BEGIN:VEVENT",`UID:${t.id}@eternal-secret`,`DTSTAMP:${utc(hoy(),"00:00")}`,
    `DTSTART:${utc(t.fecha,t.hora)}`,`DTEND:${utc(t.fecha,t.hora,t.duracion)}`,`SUMMARY:${e(t.paciente+(t.motivo?" · "+t.motivo:""))}`,`DESCRIPTION:${e([t.area,t.telefono?"Tel: "+t.telefono:"",t.notas].filter(Boolean).join("\n"))}`,
    "LOCATION:Eternal Secret","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type:"text/calendar" })); a.download = `Turno ${t.paciente} ${t.fecha}.ics`; document.body.appendChild(a); a.click(); a.remove();
}

async function vAgenda(v, semana){
  const cfg = await configAgenda();
  const lun = lunesDe(semana || hoy()), dom = masDias(lun, 6);
  const { data: ts, error } = await sb.from("v_turnos").select("*").gte("fecha", lun).lte("fecha", dom).order("fecha").order("hora"); if(error) throw error;
  const dur = Number(cfg.duracion)||30;
  const diasSemana = [0,1,2,3,4,5,6].map(i=>masDias(lun,i)).filter(f => { const wd = String(dDe(f).getDay()); return cfg.dias?.[wd] || ts.some(t=>t.fecha===f); });
  const rangos = Object.values(cfg.dias||{}); const ini = Math.min(...rangos.map(r=>minDe(r[0])), ...ts.map(t=>minDe(t.hora)), 9*60), fin = Math.max(...rangos.map(r=>minDe(r[1])), ...ts.map(t=>minDe(t.hora)+t.duracion), 13*60);
  const slots = []; for(let m = Math.floor(ini/dur)*dur; m < fin; m += dur) slots.push(m);
  const titulo = `${dDe(lun).getDate()}/${String(dDe(lun).getMonth()+1).padStart(2,"0")} al ${dDe(dom).getDate()}/${String(dDe(dom).getMonth()+1).padStart(2,"0")}`;
  const activos = ts.filter(t=>t.estado!=="Cancelado");
  v.innerHTML = `<div class="row"><h1>Agenda</h1><span class="right"></span><button class="btn" id="brec">Recordatorios de mañana</button><button class="btn pri" id="bnt2">+ Nuevo turno</button></div>
    <div class="row" style="margin:6px 0 14px"><a class="btn" href="#/agenda/${masDias(lun,-7)}">‹</a><b style="font-size:18px">Semana del ${titulo}</b><a class="btn" href="#/agenda/${masDias(lun,7)}">›</a>${lun!==lunesDe(hoy())?`<a class="btn ghost" href="#/agenda">Hoy</a>`:""}<span class="right muted">${activos.length} turnos</span></div>
    <div id="agw"></div>`;
  $("#brec").onclick = () => modalRecordatorios();
  $("#bnt2").onclick = () => modalTurno({ fecha: lun <= hoy() && hoy() <= dom ? hoy() : lun });
  const ancho = window.innerWidth > 820;
  if(ancho){
    const hoyIso = hoy();
    let g = `<div class="ag" style="grid-template-columns:56px repeat(${diasSemana.length},1fr);grid-template-rows:auto repeat(${slots.length},28px)">`;
    g += `<div class="ag-h"></div>` + diasSemana.map((f,i)=>`<div class="ag-h ${f===hoyIso?"hoy":""}" style="grid-column:${i+2}">${DIAS_C[dDe(f).getDay()]} ${dDe(f).getDate()}</div>`).join("");
    slots.forEach((m,r)=>{ g += `<div class="ag-t" style="grid-row:${r+2}">${m%60===0||dur>=60?hDe(m):""}</div>`;
      diasSemana.forEach((f,i)=>{ const h = cfg.dias?.[String(dDe(f).getDay())]; const abierto = h && m >= minDe(h[0]) && m < minDe(h[1]);
        g += `<button class="ag-c ${abierto?"":"cerrado"} ${m%60===0?"hr":""}" style="grid-row:${r+2};grid-column:${i+2}" data-f="${f}" data-h="${hDe(m)}" aria-label="Nuevo turno ${fechaLarga(f)} ${hDe(m)}"></button>`; }); });
    ts.forEach(t=>{ const i = diasSemana.indexOf(t.fecha); if(i<0) return; const r0 = Math.floor((minDe(t.hora)-slots[0])/dur);
      const span = Math.max(1, Math.ceil(t.duracion/dur));
      g += `<button class="ag-t1 ${estadoTurnoClase(t.estado)} ${t.estado==="Cancelado"?"canc":""}" style="grid-column:${i+2};grid-row:${r0+2} / span ${span}" data-t="${t.id}"><b>${t.hora.slice(0,5)}</b> ${t.modalidad==="Virtual"?"💻 ":""}${esc(t.paciente)}${t.motivo?`<span> · ${esc(t.motivo)}</span>`:""}${t.whatsapp_enviado?" ✓":""}</button>`; });
    $("#agw").innerHTML = g + `</div><p class="muted" style="font-size:13px">Tocá un horario libre para dar un turno. Las franjas grises están fuera del horario de atención (se configura en Catálogos → Agenda).</p>`;
  } else {
    $("#agw").innerHTML = [0,1,2,3,4,5,6].map(i=>masDias(lun,i)).filter(f=>diasSemana.includes(f)).map(f=>{ const del = ts.filter(t=>t.fecha===f);
      return `<div class="card tight" style="margin-bottom:10px"><div class="row" style="padding:10px 14px"><b>${fechaLarga(f)}</b><button class="btn ghost right" data-nf="${f}">+ Turno</button></div>${del.length?`<ul class="list">${del.map(t=>`<li><button class="item" style="width:100%;border:none;background:none;text-align:left" data-t="${t.id}"><div class="main"><div class="t">${t.hora.slice(0,5)} · ${t.modalidad==="Virtual"?"💻 ":""}${esc(t.paciente)}</div><div class="s">${esc(t.motivo||"")}${t.whatsapp_enviado?" · WhatsApp enviado":""}</div></div><span class="pill ${estadoTurnoClase(t.estado)}">${t.estado}</span></button></li>`).join("")}</ul>`:`<div class="empty" style="padding:12px">Sin turnos</div>`}</div>`; }).join("");
  }
  v.querySelectorAll(".ag-c").forEach(b=>b.onclick=()=>modalTurno({ fecha:b.dataset.f, hora:b.dataset.h }));
  v.querySelectorAll("[data-nf]").forEach(b=>b.onclick=()=>modalTurno({ fecha:b.dataset.nf }));
  v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>modalTurno(ts.find(t=>t.id===b.dataset.t)));
}

      $("#tpr").innerHTML = `<div class="card tight">${data.length?`<ul class="list">${data.map(p=>`<li><button type="button" class="item" style="width:100%;border:none;background:none;text-align:left" data-p="${p.id}"><div class="main"><div class="t">${esc(p.nombre)}</div><div class="s">${p.telefono?esc(p.telefono):"sin teléfono"}</div></div></button></li>`).join("")}</ul>`:""}
        <div style="padding:10px 14px;border-top:1px solid var(--line)"><b>¿Paciente nuevo?</b><div class="fields" style="margin-top:6px"><label class="f">Apellido y nombre<input id="tnn" value="${esc(q)}"></label><label class="f">Celular<input id="tnt" type="tel" placeholder="11 5555-1234"></label></div><button type="button" class="btn" id="tnok" style="margin-top:8px">Crear paciente y usarlo</button></div></div>`;

      $("#tnok").onclick = async () => { const nombre=$("#tnn").value.trim(); if(!nombre) return toast("Escribí el nombre.");
        const { data: np, error } = await sb.from("pacientes").insert({ nombre, telefono: $("#tnt").value.trim()||null }).select("id,nombre,telefono").single(); if(error) return fail(error);

    if(!rg) avisos.push(`El consultorio no atiende los ${DIAS[wd].toLowerCase()}.`); else if(minDe(h) < minDe(rg[0]) || minDe(h)+d > minDe(rg[1])) avisos.push(`Fuera del horario de atención (${rg[0]} a ${rg[1]}).`);
    const { data } = await sb.from("v_turnos").select("id,hora,duracion,paciente").eq("fecha", f).neq("estado","Cancelado");

/* Recordatorios: lista de turnos de un día con su WhatsApp listo para enviar de a uno */
async function modalRecordatorios(fechaSel){
  const f = fechaSel || masDias(hoy(), 1);
  const plantilla = await leerConfig("mensaje_recordatorio", "Hola {nombre}! Te recuerdo tu turno {modalidad} {cuando} a las {hora} hs con la Dra. Analía Jakowluk. Por favor respondé SÍ para confirmar. ¡Gracias!");
  const { data: ts } = await sb.from("v_turnos").select("*").eq("fecha", f).neq("estado","Cancelado").order("hora");
  const d = dDe(f);
  const cuando = f===masDias(hoy(),1) ? "de mañana" : f===hoy() ? "de hoy" : `del ${DIAS[d.getDay()].toLowerCase()} ${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`;
  const texto = t => plantilla.replaceAll("{nombre}", (t.paciente||"").split(" ").slice(1).join(" ") || t.paciente || "").replaceAll("{paciente}", t.paciente||"")
    .replaceAll("{cuando}", cuando).replaceAll("{dia}", DIAS[d.getDay()].toLowerCase()).replaceAll("{fecha}", `${d.getDate()}/${String(d.getMonth()+1).padStart(2,"0")}`)
    .replaceAll("{hora}", t.hora.slice(0,5)).replaceAll("{motivo}", t.motivo||"").replaceAll("{modalidad}", (t.modalidad||"Presencial").toLowerCase())
    .replaceAll("{enlace}", t.modalidad==="Virtual" && t.enlace ? ` Ingresá desde este enlace: ${t.enlace}.` : "").replaceAll("{calendario}", linkTurno(t));
  const L = ts || []; const pend = L.filter(t=>!t.recordatorio_enviado).length;
  abrirModal("Recordatorios por WhatsApp", `<div class="grid">
    <div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:10px">Turnos del <input type="date" id="rfecha" value="${f}" style="width:auto"></label><span class="right muted">${L.length} turnos · ${pend} sin recordar</span></div>
    <p class="muted" style="margin:0;font-size:14px">Tocá “Enviar” en cada paciente: se abre WhatsApp con el mensaje listo, enviás y volvés acá para el siguiente. Cuando respondan “SÍ”, tocá “Confirmó”.</p>
    ${L.length ? `<div class="card tight"><ul class="list">${L.map(t=>{ const tel = telWhatsApp(t.telefono);
      return `<li><div class="item" style="flex-wrap:wrap"><div class="main" style="min-width:180px"><div class="t">${t.hora.slice(0,5)} · ${t.modalidad==="Virtual"?"💻 ":""}${esc(t.paciente)}</div><div class="s">${esc(t.motivo||"")}${t.recordatorio_enviado?' · <b style="color:var(--ok)">recordatorio enviado ✓</b>':""}</div></div>
        <span class="pill ${estadoTurnoClase(t.estado)}">${t.estado}</span>
        ${tel ? `<a class="btn ${t.recordatorio_enviado?"":"pri"}" data-rw="${t.id}" href="https://wa.me/${tel}?text=${encodeURIComponent(texto(t))}" target="_blank" rel="noopener">${t.recordatorio_enviado?"Reenviar":"Enviar"}</a>` : `<span class="pill s-warn">sin celular</span><button class="btn" data-rt="${t.id}">Cargar celular</button>`}
        ${t.estado!=="Confirmado"?`<button class="btn ghost" data-rc="${t.id}">Confirmó</button>`:""}</div></li>`; }).join("")}</ul></div>` : `<div class="card empty">No hay turnos ese día.</div>`}
    <div class="row"><button class="btn ghost" id="rcfg">Editar el texto del recordatorio</button></div></div>`);
  $("#rfecha").onchange = e => modalRecordatorios(e.target.value);
  document.querySelectorAll("[data-rw]").forEach(a => a.addEventListener("click", () => {
    sb.from("turnos").update({ recordatorio_enviado: new Date().toISOString() }).eq("id", a.dataset.rw).then(()=>{});
    a.classList.remove("pri"); a.textContent = "Reenviar"; const s = a.closest(".item").querySelector(".s"); if(s && !s.innerHTML.includes("✓")) s.innerHTML += ' · <b style="color:var(--ok)">recordatorio enviado ✓</b>'; }));
  document.querySelectorAll("[data-rc]").forEach(b => b.onclick = async () => { const { error } = await sb.from("turnos").update({ estado:"Confirmado" }).eq("id", b.dataset.rc); if(error) return fail(error); toast("Turno confirmado"); modalRecordatorios(f); render(); });
  document.querySelectorAll("[data-rt]").forEach(b => b.onclick = () => { const t = L.find(x=>x.id===b.dataset.rt); modalTurno(t); });
  $("#rcfg").onclick = () => { cerrarModal(); location.hash = "#/ajustes"; setTimeout(()=>document.querySelector('[data-c="a"]')?.click(), 500); };
}

/* Configuración de la agenda (en Catálogos) */
async function pintaAgendaCfg(c){
  const cfg = await configAgenda(); const msg = await leerConfig("mensaje_turno", ""); const msgRec = await leerConfig("mensaje_recordatorio", ""); const token = await leerConfig("calendario_token", ""); const dir = await leerConfig("direccion_consultorio", "");
  const url = `${SUPABASE_URL}/functions/v1/agenda-ics?token=${token}`;
  c.innerHTML = `<form id="fcfg" class="grid">
    <div class="card"><h2>Horario de atención</h2><table>${[1,2,3,4,5,6,0].map(w=>{ const r=cfg.dias?.[String(w)]; return `<tr><td style="width:140px"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-w="${w}" ${r?"checked":""} style="width:auto;min-height:0"> ${DIAS[w]}</label></td><td><select data-wd="${w}" style="width:auto">${opcionesHora(r?r[0]:"09:00", 30)}</select></td><td>a</td><td><select data-wh="${w}" style="width:auto">${opcionesHora(r?r[1]:"19:00", 30)}</select></td></tr>`; }).join("")}</table>
      <label class="f" style="margin-top:10px;max-width:260px">Duración habitual de un turno<select id="cdur">${[15,20,30,40,45,60].map(m=>`<option value="${m}" ${Number(cfg.duracion)===m?"selected":""}>${m} minutos</option>`).join("")}</select></label></div>
    <div class="card"><h2>Mensaje de WhatsApp</h2><p class="muted" style="margin-top:0">Se puede usar {nombre}, {dia}, {fecha}, {hora}, {motivo}, {modalidad} (presencial / virtual), {enlace} (el link si es virtual) y {calendario} (link para que el paciente agregue el turno a su calendario, con aviso 1 hora antes); se reemplazan solos.</p><textarea id="cmsg" rows="4">${esc(msg)}</textarea>
      <h3>Mensaje de recordatorio (el día anterior)</h3><p class="muted" style="margin-top:0">Además de los anteriores se puede usar {cuando} (“de mañana”, “de hoy” o la fecha).</p><textarea id="cmsgr" rows="3">${esc(msgRec)}</textarea>
      <label class="f" style="margin-top:10px">Dirección del consultorio (aparece en el calendario del paciente)<input id="cdir" value="${esc(dir)}" placeholder="ej. Av. Siempreviva 742, Banfield"></label></div>
    <div class="row"><button class="btn pri right">Guardar configuración</button></div></form>
    <div class="card" style="margin-top:14px"><h2>Ver los turnos en el calendario del iPad / iPhone</h2>
      <p>Suscribí el calendario una sola vez y los turnos que cargues aparecen solos en el calendario del dispositivo (se actualiza cada 15–60 minutos).</p>
      <div class="row"><a class="btn pri" href="${url.replace(/^https:/,"webcal:")}">Suscribirme en este dispositivo</a><button type="button" class="btn" id="ccopy">Copiar enlace</button><button type="button" class="btn ghost danger" id="crot">Generar enlace nuevo</button></div>
      <p class="muted" style="font-size:13px">Si el botón no abre el calendario: Ajustes → Calendario → Cuentas → Añadir cuenta → Otra → Añadir calendario suscrito, y pegá el enlace. El enlace es privado: no lo compartas (si se filtró, tocá “Generar enlace nuevo”).</p></div>`;
  $("#ccopy").onclick = async () => { try{ await navigator.clipboard.writeText(url); toast("Enlace copiado"); }catch(e){ prompt("Copiá este enlace:", url); } };
  $("#crot").onclick = async () => { if(!(await confirmar("¿Generar un enlace nuevo? El anterior deja de funcionar y hay que volver a suscribirse."))) return;
    const nuevo = [...crypto.getRandomValues(new Uint8Array(24))].map(b=>b.toString(16).padStart(2,"0")).join("");
    const { error } = await sb.from("config").upsert({ clave:"calendario_token", valor: nuevo }); if(error) return fail(error); toast("Enlace nuevo generado"); pintaAgendaCfg(c); };
  $("#fcfg").onsubmit = async e => { e.preventDefault();
    const dias = {}; for(const ch of c.querySelectorAll("[data-w]")){ if(!ch.checked) continue; const w=ch.dataset.w, a=c.querySelector(`[data-wd="${w}"]`).value, b=c.querySelector(`[data-wh="${w}"]`).value; if(!a||!b||a>=b) return toast(`Revisá el horario del ${DIAS[w].toLowerCase()}.`); dias[w]=[a,b]; }
    const r1 = await sb.from("config").upsert({ clave:"agenda", valor:{ duracion:Number($("#cdur").value), dias } }); if(r1.error) return fail(r1.error);
    const r2 = await sb.from("config").upsert({ clave:"mensaje_turno", valor:$("#cmsg").value.trim() }); if(r2.error) return fail(r2.error);
    const r4 = await sb.from("config").upsert({ clave:"mensaje_recordatorio", valor:$("#cmsgr").value.trim() }); if(r4.error) return fail(r4.error);
    const r3 = await sb.from("config").upsert({ clave:"direccion_consultorio", valor:$("#cdir").value.trim() || "Eternal Secret" }); if(r3.error) return fail(r3.error);
    toast("Configuración guardada"); };
}

/* Insumos de un tratamiento (en Catálogos → Tratamientos) */
async function editorInsumos(box, tratamientoId){
  const prods = (await catalogo("productos", true)).filter(p=>p.activo);
  const { data: ins } = tratamientoId ? await sb.from("tratamiento_insumos").select("*").eq("tratamiento_id", tratamientoId) : { data: [] };
  const filas = (ins||[]).map(x=>({ producto_id:x.producto_id, cantidad:x.cantidad }));
  const opciones = sel => opcionesProductos(prods, sel);
  const pintar = () => { box.innerHTML = `<h3 style="margin-top:4px">Insumos que se descuentan del stock</h3><p class="muted" style="margin:0 0 6px;font-size:13px">Cada vez que se carga este tratamiento en una visita, se dan de baja estas unidades (de los lotes más antiguos). Ej.: activos, butterfly, suero.</p>
    ${filas.map((f,i)=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px"><select data-ip="${i}">${opciones(f.producto_id)}</select><input data-ic="${i}" type="number" min="1" step="1" value="${f.cantidad}" style="width:80px"><button type="button" class="iconbtn" data-ix="${i}">×</button></div>`).join("")}
    <button type="button" class="btn ghost" id="iadd">+ Agregar insumo</button>`;
    box.querySelectorAll("[data-ip]").forEach(s=>s.onchange=()=>filas[+s.dataset.ip].producto_id=s.value);
    box.querySelectorAll("[data-ic]").forEach(s=>s.oninput=()=>filas[+s.dataset.ic].cantidad=Math.max(1,parseInt(s.value)||1));
    box.querySelectorAll("[data-ix]").forEach(s=>s.onclick=()=>{ filas.splice(+s.dataset.ix,1); pintar(); });
    $("#iadd").onclick = () => { filas.push({ producto_id:"", cantidad:1 }); pintar(); }; };
  pintar();
  return async (tid) => { const validas = filas.filter(f=>f.producto_id);
    const r1 = await sb.from("tratamiento_insumos").delete().eq("tratamiento_id", tid); if(r1.error) throw r1.error;
    const unicos = Object.values(validas.reduce((a,f)=>{ (a[f.producto_id] ??= { tratamiento_id:tid, producto_id:f.producto_id, cantidad:0 }).cantidad += f.cantidad; return a; }, {}));
    if(unicos.length){ const r2 = await sb.from("tratamiento_insumos").insert(unicos); if(r2.error) throw r2.error; } };
}

function buscadorPacientes(input, out){
  let t;

    const q = input.value.trim(); if(q.length<2){ out.innerHTML=""; return; }
    const { data } = await sb.from("v_pacientes").select("id,nombre,dni,area,ultima_visita").or(`nombre.ilike.%${q.replace(/[%,()]/g,"")}%,dni.ilike.%${q.replace(/[%,()]/g,"")}%`).order("nombre").limit(12);

  },250); };
}

async function prepararPDF(html, landscape, nombre){
  const gen = ++PDF_GEN; PDF_LISTO = null; PDF_NOMBRE = nombre;
  const btn = document.getElementById("prshare"); if(btn){ btn.disabled = true; btn.textContent = "Preparando PDF…"; }
  try{
    await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js");
    const caja = document.createElement("div"); caja.className = "print-doc";
    caja.style.cssText = `width:${landscape?1040:715}px;background:#fff;padding:0`;
    caja.innerHTML = LOGO_DATA ? html.replaceAll('src="logo.png"', `src="${LOGO_DATA}"`) : html;
    const blob = await html2pdf().set({ margin:[10,10,10,10], image:{ type:"jpeg", quality:0.95 }, html2canvas:{ scale:2, useCORS:true, backgroundColor:"#ffffff" },
      jsPDF:{ unit:"mm", format:"a4", orientation: landscape ? "landscape" : "portrait" }, pagebreak:{ mode:["css","legacy"], avoid:["tr",".inf-ev"] } }).from(caja).outputPdf("blob");
    if(gen !== PDF_GEN) return;
    PDF_LISTO = new File([blob], nombre.replace(/[\\/:*?"<>|]/g,"") + ".pdf", { type:"application/pdf" });
    if(btn){ btn.disabled = false; btn.textContent = "Compartir PDF"; }
  }catch(e){ console.error(e); if(btn){ btn.disabled = false; btn.textContent = "Compartir PDF"; } }
}
async function compartirPDF(){
  if(!PDF_LISTO) return toast("El PDF se está preparando, tocá de nuevo en un segundo.");
  const datos = { files:[PDF_LISTO], title: PDF_NOMBRE };
  if(navigator.canShare && navigator.canShare(datos)){
    try{ await navigator.share(datos); }catch(e){ if(e.name!=="AbortError") toast("No se pudo compartir: " + e.message); }
  } else {
    const a = document.createElement("a"); a.href = URL.createObjectURL(PDF_LISTO); a.download = PDF_LISTO.name; document.body.appendChild(a); a.click(); a.remove();
  }
}
function imprimirHTML(html, clase, pageCss, nombre){

}

/* ---------- UNIFICAR PACIENTES ---------- */
async function modalUnificar(p){
  const sinTilde = x => (x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const tokens = sinTilde(p.nombre).split(/\s+/).filter(t=>t.length>=3);
  abrirModal("Unificar pacientes duplicados", `<div class="grid">
    <div class="card" style="background:var(--accent-soft);border-color:transparent"><div class="muted" style="font-size:13px;font-weight:600">SE QUEDA ESTE PACIENTE (el correcto)</div><b style="font-size:18px">${esc(p.nombre)}</b>${p.dni?` <span class="muted">· DNI ${esc(p.dni)}</span>`:""}
      <p style="margin:6px 0 0;font-size:14px">Marcá los registros duplicados (nombre mal escrito, cortado, etc.). Sus visitas, laboratorios y turnos pasan a este paciente; los datos que a este le falten (DNI, teléfono, nacimiento…) se completan con los del duplicado, y el nombre viejo queda guardado como “nombre anterior”. Después el duplicado se borra.</p></div>
    <label class="f">Buscar otros pacientes<div class="search">${ICON.search}<input id="uq" value="${esc((p.nombre||"").split(/\s+/)[0]||"")}" autocomplete="off"></div></label>
    <div id="ures"></div>
    <div class="row"><span class="muted" id="ucont"></span><button class="btn pri right" id="uok" disabled>Unificar</button></div></div>`);
  const elegidos = new Map();
  const pintar = async () => {
    const q = $("#uq").value.trim().replace(/[%,()]/g,"");
    let qy = sb.from("v_pacientes").select("id,nombre,dni,telefono,cantidad_visitas,ultima_visita,ultimo_laboratorio,nombres_anteriores").neq("id", p.id).order("nombre").limit(40);
    if(q.length>=2) qy = qy.or(`nombre.ilike.%${q}%,dni.ilike.%${q}%,nombres_anteriores.ilike.%${q}%`);
    const { data } = await qy;
    const parecido = x => { const t = sinTilde(x.nombre).split(/\s+/); return tokens.filter(k=>t.some(w=>w.startsWith(k.slice(0,4)))).length; };
    const L = (data||[]).sort((a,b)=>parecido(b)-parecido(a));
    $("#ures").innerHTML = L.length ? `<div class="card tight"><ul class="list">${L.map(x=>`<li><label class="item" style="cursor:pointer"><input type="checkbox" data-u="${x.id}" ${elegidos.has(x.id)?"checked":""} style="width:22px;height:22px;min-height:0;flex:none">
      <div class="main"><div class="t">${esc(x.nombre)}${parecido(x)>=Math.min(2,tokens.length)?' <span class="pill s-warn">parecido</span>':""}</div><div class="s">${x.dni?"DNI "+esc(x.dni):"sin DNI"} · ${x.cantidad_visitas} visitas · última ${fechaCorta(x.ultima_visita)}${x.ultimo_laboratorio?" · tiene laboratorios":""}${x.telefono?" · "+esc(x.telefono):""}</div></div></label></li>`).join("")}</ul></div>` : `<p class="muted">No hay otros pacientes con ese nombre.</p>`;
    $("#ures").querySelectorAll("[data-u]").forEach(ch=>ch.onchange=()=>{ const x=L.find(y=>y.id===ch.dataset.u); ch.checked ? elegidos.set(x.id,x) : elegidos.delete(x.id); actualizar(); });
  };
  const actualizar = () => { const n = elegidos.size, v = [...elegidos.values()].reduce((a,x)=>a+Number(x.cantidad_visitas||0),0);
    $("#ucont").textContent = n ? `${n} duplicado${n>1?"s":""} · ${v} visitas a mover` : ""; $("#uok").disabled = !n; $("#uok").textContent = n ? `Unificar ${n} en ${p.nombre}` : "Unificar"; };
  let tm; $("#uq").oninput = () => { clearTimeout(tm); tm = setTimeout(pintar, 250); };
  await pintar();
  $("#uok").onclick = async () => {
    const nombres = [...elegidos.values()].map(x=>x.nombre).join(", ");
    if(!(await confirmar(`¿Unificar ${nombres} dentro de ${p.nombre}? Los duplicados se borran (su historial pasa a ${p.nombre}).`))) return;
    $("#uok").disabled = true;
    const { data, error } = await sb.rpc("unificar_pacientes", { p_destino: p.id, p_origenes: [...elegidos.keys()] });
    if(error){ $("#uok").disabled = false; return fail(error); }
    cerrarModal(); toast(`Listo: se movieron ${data.visitas} visitas, ${data.laboratorios} valores de laboratorio y ${data.turnos} turnos`); render();
  };
}

function grafico(rs){
  const W=260,H=120,L=34,R=10,T=10,B=22;
  const r0=rs.at(-1); const vals=rs.map(r=>Number(r.valor));
  const extra=[r0.rmin,r0.rmax,r0.omin,r0.omax].filter(x=>x!=null).map(Number);
  let lo=Math.min(...vals,...extra), hi=Math.max(...vals,...extra); if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*.12; lo-=pad; hi+=pad;
  const y = v => T + (H-T-B) * (1-(v-lo)/(hi-lo));
  const n=rs.length, x = i => n===1 ? (L+(W-L-R)/2) : L + (W-L-R)*i/(n-1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${esc(r0.determinacion)}">`;
  if(r0.omin!=null||r0.omax!=null){ const a=y(r0.omax??hi), b=y(r0.omin??lo); s+=`<rect x="${L}" y="${a}" width="${W-L-R}" height="${Math.max(0,b-a)}" fill="var(--ok-soft)"/>`; }
  [r0.rmin,r0.rmax].forEach(v=>{ if(v!=null) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ink2)" stroke-dasharray="3 3" stroke-width="1"/><text x="${L-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--ink2)">${num(v)}</text>`; });
  if(n>1) s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${rs.map((r,i)=>x(i)+","+y(r.valor)).join(" ")}"/>`;
  rs.forEach((r,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(r.valor)}" r="${i===n-1?4.5:3}" fill="${i===n-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`; });
  s+=`<text x="${x(0)}" y="${H-6}" font-size="10" fill="var(--ink2)" text-anchor="${n===1?"middle":"start"}">${fechaCorta(rs[0].fecha)}</text>`;
  if(n>1) s+=`<text x="${x(n-1)}" y="${H-6}" font-size="10" fill="var(--ink2)" text-anchor="end">${fechaCorta(r0.fecha)}</text>`;
  return s+`</svg>`;
}

function tabBuscarUnidad(c){
  c.innerHTML = `<div class="card"><label class="f">Código de la etiqueta<input id="qu" placeholder="ej. L-0200 000097-01, o solo 000097" autocomplete="off" autocapitalize="characters"></label><div id="ru" style="margin-top:12px"></div></div>`;
  let t; $("#qu").oninput = () => { clearTimeout(t); t=setTimeout(async()=>{
    const q = $("#qu").value.trim().toUpperCase(); if(q.length<4){ $("#ru").innerHTML=""; return; }
    let qy = sb.from("v_unidades").select("*").order("lote_numero",{ascending:false}).order("nro").limit(60);
    const m = q.match(/^L-?\s*(\d{1,4})\s+(\d{1,6})-(\d{1,3})$/);
    if(m) qy = qy.eq("lote_numero", +m[1]).eq("producto_codigo", cod6(m[2])).eq("nro", +m[3]);
    else if(/^\d{1,6}(-\d{1,3})?$/.test(q)){ const [pc,n] = q.split("-"); qy = qy.eq("producto_codigo", cod6(pc)); if(n) qy = qy.eq("nro", +n); }
    else qy = qy.ilike("codigo", `%${q.replace(/[%,()]/g,"")}%`);
    const { data } = await qy;
    $("#ru").innerHTML = data?.length ? `<div class="tablewrap"><table><thead><tr><th>Unidad</th><th>Producto</th><th>Vto.</th><th>Estado</th><th>Detalle</th></tr></thead><tbody>${data.map(u=>`<tr><td><code>${esc(u.codigo)}</code></td><td>${esc(u.producto)}</td><td>${mmaa(u.vencimiento)}</td><td><span class="pill ${u.estado==="Disponible"?"s-ok":u.estado==="Entregada"?"s-info":"s-none"}">${u.estado}</span></td><td>${u.estado==="Entregada"?`<a href="#/p/${u.paciente_id}">${esc(u.paciente||"")}</a> · ${fecha(u.fecha_baja)}`:u.estado==="Descartada"?`${esc(u.motivo_baja||"")} · ${fecha(u.fecha_baja)}`:`Compra ${fecha(u.lote_fecha)}${u.proveedor?" · "+esc(u.proveedor):""}`}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No se encontró ninguna unidad con ese código.</p>`;
  },250); };
  $("#qu").focus();
}

/* Entrega de productos a un paciente: código 000097-02 = producto 000097, 2 unidades (lotes más antiguos primero) */
async function modalEntrega(paciente){
  const prods = (await catalogo("productos", true)).filter(x=>x.activo);
  const porCodigo = Object.fromEntries(prods.map(p=>[p.codigo, p]));
  const disp = {};   // producto_id -> unidades disponibles en orden de baja
  const cargarDisp = async pid => { if(!disp[pid]){ const { data } = await sb.from("v_unidades").select("id,codigo,codigo_corto,lote,lote_numero,nro,vencimiento").eq("producto_id",pid).eq("estado","Disponible").order("lote_numero").order("nro"); disp[pid] = data||[]; } return disp[pid]; };
  let pac = paciente; const lineas = [];
  abrirModal("Entrega de producto", `<form id="fe" class="grid">
    <div id="epac"></div>
    <div class="fields"><label class="f">Fecha<input name="fecha" type="date" required value="${hoy()}"></label></div>
    <div class="card" style="background:var(--accent-soft);border-color:transparent">
      <label class="f">Código del producto<div class="row" style="flex-wrap:nowrap"><input id="ecod" placeholder="000097-02  (código - cantidad)" autocomplete="off" inputmode="text" autocapitalize="characters" style="font-family:ui-monospace,Menlo,monospace;font-size:18px"><button type="button" class="btn pri" id="eadd">Agregar</button></div></label>
      <p class="muted" style="margin:6px 0 0;font-size:13px">Escribí el código de 6 cifras y la cantidad (ej. <b>000097-02</b> son 2 unidades). Para una unidad puntual, escribí la etiqueta completa (ej. <b>L-0200 000097-01</b>). También podés elegirlo de la lista:</p>
      <select id="esel" style="margin-top:8px"><option value="">— elegir producto de la lista —</option>${["Funcional","Estética"].map(l=>`<optgroup label="${l}">`+prods.filter(x=>x.linea===l).map(x=>`<option value="${x.codigo}">${esc(prodLabel(x))} · stock ${x.stock_actual}</option>`).join("")+`</optgroup>`).join("")}</select>
      <div id="emsg" style="color:var(--bad);font-weight:600;margin-top:6px"></div></div>
    <div id="elin"></div>
    <label class="f">Observación (opcional)<input name="obs"></label>
    <div class="row"><b>Total: <span id="etot">$ 0</span></b><button class="btn pri right" type="submit" id="eok">Registrar entrega</button></div></form>`);
  const pintaPac = () => {
    if(pac){ $("#epac").innerHTML = `<div class="row"><div><div class="muted" style="font-size:13px;font-weight:600">PACIENTE</div><b style="font-size:18px">${esc(pac.nombre)}</b></div>${paciente?"":`<button type="button" class="btn ghost right" id="ecamb">Cambiar</button>`}</div>`; if(!paciente) $("#ecamb").onclick=()=>{ pac=null; pintaPac(); }; return; }
    $("#epac").innerHTML = `<label class="f">Paciente<div class="search">${ICON.search}<input id="epq" placeholder="Buscar por apellido, nombre o DNI" autocomplete="off"></div></label><div id="epr"></div>`;
    let t; $("#epq").oninput = () => { clearTimeout(t); t=setTimeout(async()=>{ const q=$("#epq").value.trim().replace(/[%,()]/g,""); if(q.length<2){ $("#epr").innerHTML=""; return; }
      const { data } = await sb.from("pacientes").select("id,nombre,dni").or(`nombre.ilike.%${q}%,dni.ilike.%${q}%`).order("nombre").limit(8);
      $("#epr").innerHTML = `<div class="card tight">${data.length?`<ul class="list">${data.map(p=>`<li><button type="button" class="item" style="width:100%;border:none;background:none;text-align:left;cursor:pointer" data-p="${p.id}"><div class="main"><div class="t">${esc(p.nombre)}</div><div class="s">${p.dni?"DNI "+esc(p.dni):""}</div></div></button></li>`).join("")}</ul>`:`<div class="empty">Sin resultados.</div>`}</div>`;
      $("#epr").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ pac=data.find(x=>x.id===b.dataset.p); pintaPac(); $("#ecod").focus(); }); },250); };
    $("#epq").focus();
  };
  pintaPac();
  const msg = t => { $("#emsg").textContent = t||""; };
  const asignacion = () => { // simula la baja igual que el servidor
    const usadas = new Set(); lineas.forEach(l=>l.pedidas.forEach(c=>usadas.add(c)));
    return lineas.map(l => { const libres = disp[l.prod.id].filter(u=>!usadas.has(u.codigo) && !l.pedidas.includes(u.codigo));
      const fifo = libres.slice(0, Math.max(0, l.cantidad - l.pedidas.length)); fifo.forEach(u=>usadas.add(u.codigo));
      const total = disp[l.prod.id].length - lineas.filter(o=>o!==l && o.prod.id===l.prod.id).reduce((a,o)=>a+o.cantidad,0);
      return { unidades: [...l.pedidas.map(c=>disp[l.prod.id].find(u=>u.codigo===c)), ...fifo], falta: l.cantidad - l.pedidas.length - fifo.length, quedan: total }; });
  };
  const pintar = () => {
    const asg = asignacion(); let tot = 0, hayFalta = false;
    $("#elin").innerHTML = lineas.length ? `<div class="card tight"><div class="tablewrap"><table><thead><tr><th>Producto</th><th class="num">Cant.</th><th>Unidades que se dan de baja</th><th class="num">Importe $</th><th></th></tr></thead><tbody>${lineas.map((l,i)=>{ tot += Number(l.monto||0); if(asg[i].falta>0) hayFalta = true;
      return `<tr><td><code>${l.prod.codigo_txt}</code><br><b>${esc(l.prod.nombre)}</b></td><td class="num"><input type="number" min="1" step="1" value="${l.cantidad}" data-q="${i}" style="width:70px;text-align:right"></td>
        <td style="font-size:13px">${asg[i].unidades.map(u=>`<code>${esc(u.codigo)}</code>${u.vencimiento?` <span class="muted">vto ${mmaa(u.vencimiento)}</span>`:""}`).join("<br>")}${asg[i].falta>0?`<div style="color:var(--bad);font-weight:600">Stock insuficiente: faltan ${asg[i].falta}</div>`:""}</td>
        <td class="num"><input type="number" step="any" inputmode="decimal" value="${l.monto??""}" data-m="${i}" style="width:110px;text-align:right"></td><td><button type="button" class="iconbtn" data-x="${i}">×</button></td></tr>`; }).join("")}</tbody></table></div></div>` : `<p class="muted" style="margin:0">Todavía no agregaste productos.</p>`;
    $("#etot").textContent = pesos(tot); $("#eok").disabled = !lineas.length || hayFalta;
    $("#elin").querySelectorAll("[data-q]").forEach(inp=>inp.onchange=()=>{ const l=lineas[+inp.dataset.q]; const n=Math.max(1,Math.floor(+inp.value||1)); l.cantidad=Math.max(n,l.pedidas.length); if(!l.montoTocado) l.monto = l.prod.precio!=null ? l.prod.precio*l.cantidad : l.monto; pintar(); });
    $("#elin").querySelectorAll("[data-m]").forEach(inp=>inp.oninput=()=>{ const l=lineas[+inp.dataset.m]; l.monto = inp.value; l.montoTocado = true; let t=0; lineas.forEach(x=>t+=Number(x.monto||0)); $("#etot").textContent=pesos(t); });
    $("#elin").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ lineas.splice(+b.dataset.x,1); pintar(); });
  };
  const agregarLinea = async (prod, cant, codigoUnidad) => {
    await cargarDisp(prod.id);
    let l = lineas.find(x=>x.prod.id===prod.id);
    if(!l){ l = { prod, cantidad: 0, pedidas: [], monto: null, montoTocado: false }; lineas.push(l); }
    if(codigoUnidad){ if(l.pedidas.includes(codigoUnidad)){ msg("Esa unidad ya está en la lista."); return; } l.pedidas.push(codigoUnidad); l.cantidad = Math.max(l.cantidad + 1, l.pedidas.length); }
    else l.cantidad += cant;
    if(!l.montoTocado) l.monto = prod.precio!=null ? prod.precio*l.cantidad : null;
    msg(""); pintar();
  };
  const procesar = async () => {
    const t = $("#ecod").value.trim().toUpperCase(); if(!t) return;
    let m = t.match(/^L-?\s*(\d{1,4})\s+(\d{1,6})-(\d{1,3})$/);
    if(m){ const prod = porCodigo[+m[2]]; if(!prod) return msg(`No existe el producto ${cod6(m[2])}.`);
      const u = (await cargarDisp(prod.id)).find(x=>x.lote_numero===+m[1] && x.nro===+m[3]);
      if(!u) return msg(`La unidad ${lote4(+m[1])} ${cod6(m[2])}-${String(+m[3]).padStart(2,"0")} no está disponible (no existe, ya se entregó o se descartó).`);
      await agregarLinea(prod, 1, u.codigo); $("#ecod").value = ""; return; }
    m = t.match(/^(\d{1,6})(?:\s*-\s*(\d{1,2}))?$/);
    if(!m) return msg("Formato no reconocido. Usá 000097-02 o L-0200 000097-01.");
    const prod = porCodigo[+m[1]]; if(!prod) return msg(`No existe el producto ${cod6(m[1])}.`);
    const cant = m[2] ? +m[2] : 1; if(cant<1) return msg("La cantidad tiene que ser 1 o más.");
    await agregarLinea(prod, cant); $("#ecod").value = ""; $("#ecod").focus();
  };
  $("#eadd").onclick = procesar;
  $("#ecod").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); procesar(); } };
  $("#esel").onchange = async e => { const p = porCodigo[+e.target.value]; e.target.value=""; if(p) await agregarLinea(p, 1); };
  pintar();
  $("#fe").onsubmit = async e => { e.preventDefault();
    if(!pac) return toast("Elegí el paciente."); if(!lineas.length) return toast("Agregá al menos un producto.");
    const f = Object.fromEntries(new FormData(e.target));
    const items = lineas.map(l=>({ producto_id: l.prod.id, cantidad: l.cantidad, monto: Number(l.monto||0), unidades: l.pedidas }));
    $("#eok").disabled = true;
    const { error } = await sb.rpc("registrar_entrega", { p_paciente: pac.id, p_fecha: f.fecha, p_area: areaDeLineas(lineas.map(l=>l.prod.linea)), p_obs: f.obs || null, p_items: items });
    $("#eok").disabled = false; if(error) return fail(error);
    cerrarModal(); cache.productos = null; toast(`Entrega registrada · ${lineas.reduce((a,l)=>a+l.cantidad,0)} unidades dadas de baja`);
    if(paciente) render(); else location.hash = `#/p/${pac.id}/visitas`;
  };
  if(pac) $("#ecod").focus();
}

/* ---------- FACTURACIÓN ---------- */
async function vFacturacion(v){
  let all=[], from=0; while(true){ const { data, error } = await sb.from("v_visitas").select("fecha,area,total").range(from, from+999); if(error) throw error; all=all.concat(data); if(data.length<1000) break; from+=1000; }
  const meses = {}; all.forEach(x=>{ const m=x.fecha.slice(0,7); const o=(meses[m]??={tot:0,est:0,fun:0,amb:0,n:0}); const t=Number(x.total||0); o.tot+=t; o.n++; if(x.area==="Estética") o.est+=t; else if(x.area==="Funcional") o.fun+=t; else o.amb+=t; });
  const keys = Object.keys(meses).sort().reverse(); const max = Math.max(...keys.map(k=>meses[k].tot),1);
  v.innerHTML = `<h1>Facturación</h1><p class="sub">Total por mes y por área, desde las visitas cargadas (incluye la facturación histórica de Notion).</p>
    <div class="card tight"><div class="tablewrap"><table><thead><tr><th>Mes</th><th class="num">Visitas</th><th class="num">Estética</th><th class="num">Funcional</th><th class="num">Ambas / otros</th><th class="num">Total</th><th style="width:22%"></th></tr></thead><tbody>${keys.map(k=>{const o=meses[k];const [y,m]=k.split("-");return `<tr><td><b>${MESES[+m-1]} ${y}</b></td><td class="num">${o.n}</td><td class="num">${pesos(o.est)}</td><td class="num">${pesos(o.fun)}</td><td class="num muted">${pesos(o.amb)}</td><td class="num"><b>${pesos(o.tot)}</b></td><td><div class="bar"><span style="width:${(o.tot/max*100).toFixed(1)}%"></span></div></td></tr>`}).join("")}</tbody></table></div></div>`;
}

    <div class="wide" id="secedad" hidden><p class="muted" style="margin:0 0 8px">Se usa la edad del paciente a la fecha del análisis (hace falta su fecha de nacimiento). Si no tiene sexo cargado, se usan los rangos de mujeres.</p><div class="fields">${EDADES.flatMap(x=>[fila(x,"Femenino",`Mujeres · ${x} años`),fila(x,"Masculino",`Hombres · ${x} años`)]).join("")}</div></div>
    <label class="f wide">Notas<input name="notas" value="${esc(d.notas)}"></label>
    <div class="wide row"><button class="btn pri right">Guardar</button></div></form>`);
  const ajustar = box => { const t=$(".rg-t",box).value; $(".rg-a",box).hidden = !(t==="entre"||t==="mayor"); $(".rg-b",box).hidden = !(t==="entre"||t==="menor"); $(".rg-y",box).hidden = t!=="entre"; };
  document.querySelectorAll(".rgbox").forEach(box => { ajustar(box); $(".rg-t",box).onchange = () => ajustar(box); });
  const secciones = () => { const v=$("#rpor").value; $("#secbase").hidden = !!v; $("#secfase").hidden = v!=="fase"; $("#secedad").hidden = v!=="edad"; };
  $("#rpor").onchange = secciones; secciones();
  const leer = box => { const t=$(".rg-t",box).value, a=$(".rg-a",box).value, b=$(".rg-b",box).value;
    const mn = (t==="entre"||t==="mayor") && a!=="" ? Number(a) : null, mx = (t==="entre"||t==="menor") && b!=="" ? Number(b) : null;
    if(t==="entre" && (mn==null||mx==null)) throw "Completá los dos valores del rango “entre”.";
    if(t==="entre" && mn>mx) throw "En un rango “entre”, el primer número tiene que ser menor que el segundo.";
    if((t==="mayor"&&mn==null)||(t==="menor"&&mx==null)) throw "Falta el número de un rango.";
    return [mn, mx]; };
  $("#fd").onsubmit = async e => { e.preventDefault();
    const rpor = $("#rpor").value || null;
    const x = { unidad: $("#fd [name=unidad]").value.trim() || null, notas: $("#fd [name=notas]").value.trim() || null, rangos_revisados: true, rango_por: rpor };
    const filas = [];
    try{
      for(const box of document.querySelectorAll("#secbase .rgbox")){ const [mn,mx]=leer(box); const k=box.dataset.key, base=k.replace("_h",""), suf=k.endsWith("_h")?"_h":""; x[`${base}_min${suf}`]=mn; x[`${base}_max${suf}`]=mx; }
      const sec = rpor==="fase" ? "#secfase" : rpor==="edad" ? "#secedad" : null;
      if(sec) for(const f of document.querySelectorAll(sec+" .espfila")){ const [rmn,rmx]=leer($('[data-key="ref"]',f)); const [omn,omx]=leer($('[data-key="opt"]',f));
        if([rmn,rmx,omn,omx].some(v=>v!=null)) filas.push({ determinacion_id: d.id, categoria: f.dataset.cat, sexo: f.dataset.sexo, ref_min:rmn, ref_max:rmx, opt_min:omn, opt_max:omx }); }
    }catch(err){ return toast(err); }
    const r1 = await sb.from("determinaciones").update(x).eq("id",d.id); if(r1.error) return fail(r1.error);
    if(rpor){ const r2 = await sb.from("rangos_especiales").delete().eq("determinacion_id", d.id); if(r2.error) return fail(r2.error);
      if(filas.length){ const r3 = await sb.from("rangos_especiales").insert(filas); if(r3.error) return fail(r3.error); } }
    cerrarModal(); toast("Rangos guardados"); cache.determinaciones=null; render(); };
}

/* ---------- modales ---------- */
function abrirModal(titulo, html){
  cerrarModal();
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="mbg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="modal-head"><h2 style="margin:0">${esc(titulo)}</h2><button class="iconbtn" id="mclose" aria-label="Cerrar">×</button></div>${html}</div>`;
  document.body.appendChild(bg); $("#mclose").onclick=cerrarModal; bg.onclick=e=>{ if(e.target===bg) cerrarModal(); };
  setTimeout(()=>{ const f=bg.querySelector("input:not([type=checkbox]),select"); if(f && window.innerWidth>820) f.focus(); },50);
}
function cerrarModal(){ $("#mbg")?.remove(); }
function confirmar(msg){ return new Promise(res=>{ const bg=document.createElement("div"); bg.className="modal-bg"; bg.style.zIndex=60;
  bg.innerHTML=`<div class="modal" style="max-width:420px"><p style="font-weight:600">${esc(msg)}</p><div class="row"><button class="btn right" id="cno">Cancelar</button><button class="btn pri" id="csi">Sí, eliminar</button></div></div>`;
  document.body.appendChild(bg); $("#cno",bg).onclick=()=>{bg.remove();res(false)}; $("#csi",bg).onclick=()=>{bg.remove();res(true)}; }); }

/* ---------- arranque ---------- */
let enRecuperacion = false;
/* Importante: no llamar a Supabase dentro del callback de auth (bloquea la sesión guardada y deja la pantalla en blanco).
   Por eso el trabajo se difiere con setTimeout. */
let arrancando = false;
async function arrancar(s){
  if(arrancando) return; arrancando = true;
  try{
    session = s;
    if(!session) return pantallaLogin();
    $("#root").innerHTML = `<div class="login"><div class="brand">Eternal Secret<small>Cargando…</small></div></div>`;
    await verificarAcceso();
    if(!autorizado) return pantallaSinPermiso();
    await contarAlertas(); shell(); render();
  }catch(e){ console.error(e); pantallaLogin("No se pudo conectar. Revisá internet y volvé a intentar."); }
  finally{ arrancando = false; }
}
sb.auth.onAuthStateChange((ev, s) => {
  if(ev==="PASSWORD_RECOVERY"){ enRecuperacion=true; session=s; setTimeout(pantallaNuevaClave,0); return; }
  if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT"){
    if(enRecuperacion) return;
    if(ev==="SIGNED_IN" && session && s && session.user.id===s.user.id && $("#view")) { session=s; return; } // al volver a la app no recargar todo
    setTimeout(()=>arrancar(s),0);
  }
});
// Red de seguridad: si en 6 segundos no apareció nada, mostrar el login
setTimeout(()=>{ if(!$("#root").innerHTML.trim()) pantallaLogin(); },6000);
</script>
