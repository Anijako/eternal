<style>
/* Layout: barra lateral (iPad horizontal) / barra inferior (vertical y celular); contenido en tarjetas sobrias */
:root{
  --bg:#F6F3F5; --surface:#FFFFFF; --surface2:#F0EAEE; --line:#E2D8DE;
  --ink:#241A21; --ink2:#6B5A65; --accent:#5B2A4C; --accent-ink:#FFFFFF; --accent-soft:#EEDFE8;
  --ok:#2E7D5B; --ok-soft:#E3F2EA; --warn:#A86A00; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#FBE4E2; --info:#2F5D9E; --info-soft:#E3ECF8;
  --display:"Newsreader", Georgia, serif; --body:"Figtree", -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#17121A; --surface:#211A24; --surface2:#2A2230; --line:#3A3040;
  --ink:#F2EAF0; --ink2:#B7A6B2; --accent:#D9A6C8; --accent-ink:#2A1224; --accent-soft:#3B2636;
  --ok:#6FCB9F; --ok-soft:#1E3529; --warn:#E8B655; --warn-soft:#3A2E17; --bad:#F2928A; --bad-soft:#3D2120; --info:#8DB4EC; --info-soft:#1D2A3D;
  color-scheme:dark; } }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100%}
nav.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-size:24px;color:var(--accent);padding:4px 10px 16px;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.navbtn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn.on{background:var(--accent-soft);color:var(--accent)}
.navbtn .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px}
.side .spacer{flex:1}
main{flex:1;min-width:0;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px 100px}
.wrap{max-width:1100px;margin:0 auto}
nav.bottom{display:none}
@media (max-width:820px){
  nav.side{display:none}
  main{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 90px)}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:20}
  nav.bottom .navbtn{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;position:relative}
  nav.bottom .navbtn .dot{position:absolute;top:2px;right:18%;margin:0;font-size:10px}
}
h1{font-family:var(--display);font-weight:600;font-size:30px;margin:4px 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:18px 0 8px;font-weight:600}
.sub{color:var(--ink2);margin:0 0 18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:0;overflow:hidden}
.stat .n{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--ink2);font-size:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);font-weight:600;min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
textarea{min-height:80px;resize:vertical}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.fields .wide{grid-column:1/-1}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--ink2)}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:none}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;color:var(--ink);min-height:56px}
.item:hover{background:var(--surface2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-est{background:#F6DDEA;color:#8A2C61}.p-fun{background:#DDEFE5;color:#25694B}.p-amb{background:var(--surface2);color:var(--ink2)}
@media (prefers-color-scheme: dark){.p-est{background:#43233A;color:#F0B5D8}.p-fun{background:#1F3A2C;color:#9BDDB9}}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-warn{background:var(--warn-soft);color:var(--warn)}.s-bad{background:var(--bad-soft);color:var(--bad)}.s-info{background:var(--info-soft);color:var(--info)}.s-none{background:var(--surface2);color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto}
.tab{appearance:none;border:none;background:none;padding:10px 14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px}
.tab.on{color:var(--accent);border-color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
td.num,th.num{text-align:right}
.muted{color:var(--ink2)}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:821px){.modal-bg{align-items:center}}
.modal{background:var(--bg);width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
@media (min-width:821px){.modal{border-radius:18px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.itemrow{display:grid;grid-template-columns:130px 1fr 80px 120px 40px;gap:8px;align-items:end;padding:10px 0;border-top:1px dashed var(--line)}
@media (max-width:640px){.itemrow{grid-template-columns:1fr 1fr}.itemrow .x{justify-self:end}}
.iconbtn{appearance:none;border:none;background:none;width:40px;height:44px;cursor:pointer;color:var(--ink2);font-size:22px}
.labgroup{margin-bottom:8px}
.labrow{display:grid;grid-template-columns:1fr 110px 90px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.labrow .rng{font-size:12.5px;color:var(--ink2)}
.evo{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.evo .card{padding:12px 14px}
.evo svg{width:100%;height:auto;display:block}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .brand{text-align:center;font-size:34px;padding-bottom:6px}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.right{margin-left:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* etiquetas */
.etq{display:flex;align-items:center;gap:2.2mm;overflow:hidden;color:#111;font-family:var(--body);box-sizing:border-box}
.etq img{flex:none;object-fit:contain}
.etq-t{min-width:0;line-height:1.15}
.etq-n{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.etq-c{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.02em}
.etq-v{color:#444}
.etq-a4{width:63.5mm;height:38.1mm;padding:2.5mm 3mm}
.etq-a4 img{width:20mm;height:20mm}.etq-a4 .etq-n{font-size:9.5pt}.etq-a4 .etq-l{font-size:8.5pt;margin-top:1mm}.etq-a4 .etq-c{font-size:12.5pt;margin-top:.5mm}.etq-a4 .etq-v{font-size:7.5pt}
.etq-rollo{width:50mm;height:30mm;padding:2mm 2.2mm}
.etq-rollo img{width:15mm;height:15mm}.etq-rollo .etq-n{font-size:8pt}.etq-rollo .etq-l{font-size:7.5pt;margin-top:.6mm}.etq-rollo .etq-c{font-size:10.5pt}.etq-rollo .etq-v{font-size:6.5pt}
#print{display:none}
@media print{
  body.printing{background:#fff}
  body.printing > *:not(#print){display:none!important}
  body.printing #print{display:block}
  #print.print-a4{display:grid!important;grid-template-columns:repeat(3,63.5mm);column-gap:2.5mm;grid-auto-rows:38.1mm}
  #print.print-a4 .etq:nth-child(21n){break-after:page}
  #print.print-rollo .etq{break-after:page}
  #print .etq{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.login .logo{display:block;width:120px;height:120px;margin:0 auto 8px}
</style>

<body>
<div id="root"></div>
<script>
const APP_VERSION = "2026-10-31c";
async function chequearVersion(){ try{ const r = await fetch("version.json?_=" + Date.now(), { cache: "no-store" }); const v = (await r.json()).version;
  if(v && v !== APP_VERSION && sessionStorage.getItem("recargado") !== v){ sessionStorage.setItem("recargado", v); location.replace(location.pathname + "?v=" + v + location.hash); } }catch(e){} }
chequearVersion(); document.addEventListener("visibilitychange", () => { if(!document.hidden) chequearVersion(); });
const SUPABASE_URL = "https://fqkimypjlxdsytcvoyal.supabase.co";
const SUPABASE_KEY = "sb_publishable_dVJpG6Ib7UjwtWg-aX3mNw_UrLpKF0U";
if(typeof supabase==="undefined"){ document.getElementById("root").innerHTML='<div style="max-width:380px;margin:20vh auto;padding:16px;font-family:sans-serif;text-align:center"><h2>Sin conexión</h2><p>No se pudo cargar la app. Revisá que el iPad tenga internet y volvé a abrirla.</p><button onclick="location.reload()" style="padding:12px 20px;font-size:16px">Reintentar</button></div>'; throw new Error("sin supabase"); }
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ---------- utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pesos = n => (n==null||isNaN(n)) ? "—" : "$ " + Math.round(Number(n)).toLocaleString("es-AR");
const num = n => (n==null||n==="") ? "—" : Number(n).toLocaleString("es-AR",{maximumFractionDigits:2});
const hoy = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fecha = s => { if(!s) return "—"; const [y,m,d]=s.slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fechaCorta = s => { if(!s) return "—"; const [y,m,d]=s.slice(0,10).split("-"); return `${+d} ${MESES[+m-1]} ${y.slice(2)}`; };
const areaPill = a => !a ? "" : `<span class="pill ${a==="Estética"?"p-est":a==="Funcional"?"p-fun":"p-amb"}">${esc(a)}</span>`;
const estadoClase = e => ({"Óptimo":"s-ok","Normal":"s-ok","Fuera del óptimo":"s-warn","Alto":"s-bad","Bajo":"s-info","Sin rango":"s-none"}[e]||"s-none");
const alertaClase = a => ({"Sin stock":"s-bad","Vencido":"s-bad","Vence en menos de 30 días":"s-warn","Stock bajo":"s-warn"}[a]||"s-ok");
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function fail(e){ console.error(e); toast("No se pudo guardar: " + (e?.message||e)); }
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  pac:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>',
  fact:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  conf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
};

/* ---------- cache de catálogos ---------- */
const cache = {};
async function catalogo(nombre, force=false){
  if(cache[nombre] && !force) return cache[nombre];
  let q;
  if(nombre==="determinaciones") q = sb.from("determinaciones").select("*").order("orden");
  if(nombre==="tratamientos") q = sb.from("tratamientos").select("*").order("nombre");
  if(nombre==="productos") q = sb.from("v_inventario").select("*").order("nombre");
  const { data, error } = await q; if(error) throw error;
  return cache[nombre] = data;
}

/* ---------- autenticación ---------- */
let session = null, autorizado = false, alertasStock = 0;
async function verificarAcceso(){
  const { count } = await sb.from("determinaciones").select("id", { count:"exact", head:true });
  autorizado = (count||0) > 0;
}
function pantallaLogin(msg=""){
  $("#root").innerHTML = `
  <div class="login">
    <img class="logo" src="logo.png" alt="Eternal Secret">
    <div class="brand">Eternal Secret<small>Consultorio</small></div>
    <div class="card">
      <form id="flog" class="grid">
        <label class="f">Email<input id="lemail" type="email" autocomplete="username" required></label>
        <label class="f">Contraseña<input id="lpass" type="password" autocomplete="current-password" required minlength="6"></label>
        <button class="btn pri" type="submit">Entrar</button>
        <div class="row"><button class="btn ghost" type="button" id="bcrear">Crear mi usuario</button><button class="btn ghost right" type="button" id="bolvido">Olvidé la contraseña</button></div>
        <p class="muted" id="lmsg" style="margin:0">${esc(msg)}</p>
      </form>
    </div>
  </div>`;
  $("#flog").onsubmit = async e => { e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#lemail").value.trim(), password: $("#lpass").value });
    if(error) $("#lmsg").textContent = "Email o contraseña incorrectos."; };
  $("#bcrear").onclick = async () => {
    const email=$("#lemail").value.trim(), pass=$("#lpass").value;
    if(!email || pass.length<6){ $("#lmsg").textContent="Escribí tu email y una contraseña de al menos 6 caracteres, y tocá de nuevo."; return; }
    const { error } = await sb.auth.signUp({ email, password: pass, options:{ emailRedirectTo: location.origin + location.pathname } });
    $("#lmsg").textContent = error ? error.message : "Listo. Revisá tu mail y confirmá la cuenta; después entrá con tu email y contraseña.";
  };
  $("#bolvido").onclick = async () => {
    const email=$("#lemail").value.trim(); if(!email){ $("#lmsg").textContent="Escribí tu email arriba y tocá de nuevo."; return; }
    await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    $("#lmsg").textContent="Te mandamos un mail para cambiar la contraseña.";
  };
}
function pantallaSinPermiso(){
  $("#root").innerHTML = `<div class="login"><div class="brand">Eternal Secret</div><div class="card"><p>Tu usuario (<b>${esc(session.user.email)}</b>) todavía no está autorizado para ver los datos del consultorio.</p><p class="muted">Pedí que lo agreguen a la lista de usuarios autorizados.</p><button class="btn" id="bsalir">Salir</button></div></div>`;
  $("#bsalir").onclick = () => sb.auth.signOut();
}
async function pantallaNuevaClave(){
  $("#root").innerHTML = `<div class="login"><div class="brand">Nueva contraseña</div><div class="card"><form id="fnp" class="grid"><label class="f">Contraseña nueva<input id="np" type="password" minlength="6" required></label><button class="btn pri">Guardar</button></form></div></div>`;
  $("#fnp").onsubmit = async e => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: $("#np").value }); if(error) fail(error); else { toast("Contraseña actualizada"); location.hash="#/"; render(); } };
}

/* ---------- estructura ---------- */
const NAV = [["#/","Inicio","home"],["#/pacientes","Pacientes","pac"],["#/stock","Stock","stock"],["#/facturacion","Facturación","fact"],["#/ajustes","Catálogos","conf"]];
function shell(){
  const nav = (cls) => NAV.map(([h,t,i]) => `<a class="navbtn" data-h="${h}" href="${h}">${ICON[i]}<span>${t}</span>${i==="stock"&&alertasStock?`<span class="dot">${alertasStock}</span>`:""}</a>`).join("");
  $("#root").innerHTML = `<div class="app">
    <nav class="side"><div class="brand">Eternal Secret<small>Consultorio</small></div>${nav()}<div class="spacer"></div><button class="btn ghost" id="bout">Salir</button></nav>
    <main><div class="wrap" id="view"></div></main>
    <nav class="bottom">${nav()}</nav></div>`;
  $("#bout").onclick = () => sb.auth.signOut();
}
function marcarNav(){
  const h = location.hash || "#/";
  document.querySelectorAll(".navbtn").forEach(a => { const d=a.dataset.h; a.classList.toggle("on", d==="#/" ? (h==="#/"||h==="") : h.startsWith(d) || (d==="#/pacientes" && h.startsWith("#/p/"))); });
}
async function contarAlertas(){
  try{ const p = await catalogo("productos", true); alertasStock = p.filter(x=>x.activo && x.alerta).length; }catch(e){ alertasStock=0; }
}
async function render(){
  if(!$("#view")) shell();
  marcarNav();
  const h = location.hash || "#/"; const v = $("#view");
  v.innerHTML = `<p class="muted">Cargando…</p>`;
  try{
    let m;
    if(h==="#/"||h==="") await vInicio(v);
    else if(h==="#/pacientes") await vPacientes(v);

}

function grafico(rs){
  const W=260,H=120,L=34,R=10,T=10,B=22;
  const r0=rs.at(-1); const vals=rs.map(r=>Number(r.valor));
  const extra=[r0.rmin,r0.rmax,r0.omin,r0.omax].filter(x=>x!=null).map(Number);
  let lo=Math.min(...vals,...extra), hi=Math.max(...vals,...extra); if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*.12; lo-=pad; hi+=pad;
  const y = v => T + (H-T-B) * (1-(v-lo)/(hi-lo));
  const n=rs.length, x = i => n===1 ? (L+(W-L-R)/2) : L + (W-L-R)*i/(n-1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${esc(r0.determinacion)}">`;
  if(r0.omin!=null||r0.omax!=null){ const a=y(r0.omax??hi), b=y(r0.omin??lo); s+=`<rect x="${L}" y="${a}" width="${W-L-R}" height="${Math.max(0,b-a)}" fill="var(--ok-soft)"/>`; }
  [r0.rmin,r0.rmax].forEach(v=>{ if(v!=null) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ink2)" stroke-dasharray="3 3" stroke-width="1"/><text x="${L-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--ink2)">${num(v)}</text>`; });
  if(n>1) s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${rs.map((r,i)=>x(i)+","+y(r.valor)).join(" ")}"/>`;
  rs.forEach((r,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(r.valor)}" r="${i===n-1?4.5:3}" fill="${i===n-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`; });
  s+=`<text x="${x(0)}" y="${H-6}" font-size="10" fill="var(--ink2)" text-anchor="${n===1?"middle":"start"}">${fechaCorta(rs[0].fecha)}</text>`;
  if(n>1) s+=`<text x="${x(n-1)}" y="${H-6}" font-size="10" fill="var(--ink2)" text-anchor="end">${fechaCorta(r0.fecha)}</text>`;
  return s+`</svg>`;
}

const mmaaAFecha = t => { const m = (t||"").trim().match(/^(\d{1,2})\s*[\/\-.]?\s*(\d{2})$/); if(!m) return null; const mo=+m[1], y=2000+ +m[2]; if(mo<1||mo>12) return null; const d=new Date(y,mo,0).getDate(); return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; };
const sumarMeses = (iso, n) => { const [y,m] = iso.split("-").map(Number); const t = m-1+n; return `${String(t%12+1).padStart(2,"0")}/${String(y+Math.floor(t/12)).slice(2)}`; };

    <label style="display:flex;align-items:center;gap:8px;font-size:14px"><input type="checkbox" id="cupd" checked style="width:auto;min-height:0"> Actualizar el costo de cada producto con el de esta compra (el precio de venta cargado también se actualiza)</label>
    <div class="row"><span class="muted" id="cres"></span><button class="btn pri right" type="submit">Guardar compra y ver etiquetas</button></div></form>`);
  const box = $("#cits");
  const resumen = () => { let u=0, t=0; box.querySelectorAll(".citem").forEach(r=>{ const q=+$(".c-cant",r).value||0; u+=q; t+=q*(+$(".c-cost",r).value||0); }); $("#cres").textContent = `${u} unidades · ${u} etiquetas · costo ${pesos(t)}`; };
  const agregar = (prodId) => {
    box.insertAdjacentHTML("beforeend", `<div class="itemrow citem" style="grid-template-columns:minmax(160px,1fr) 70px 105px 105px 90px 40px">
      <label class="f">Producto<select class="c-prod" required>${opciones}</select></label>
      <label class="f">Cant.<input class="c-cant" type="number" min="1" step="1" inputmode="numeric" required value="1"></label>
      <label class="f">Costo unit. $<input class="c-cost" type="number" step="any" inputmode="decimal"></label>
      <label class="f">Precio venta $<input class="c-pv" type="number" step="any" inputmode="decimal"></label>
      <label class="f">Vto. (MM/AA)<input class="c-vto" inputmode="numeric" placeholder="MM/AA" maxlength="5" required value="${sumarMeses($("#fc [name=fecha]").value||hoy(),6)}"></label>
      <button type="button" class="iconbtn x" title="Quitar">×</button></div>`);
    const r = box.lastElementChild;
    mascaraMMAA($(".c-vto",r)); $(".c-vto",r).oninput = () => { $(".c-vto",r).dataset.tocado = 1; };
    $(".c-vto",r).addEventListener("input", () => r.querySelector(".c-vto").dataset.tocado = 1);
    $(".c-prod",r).onchange = e => { const o=e.target.selectedOptions[0]; if(o?.dataset.c) $(".c-cost",r).value=o.dataset.c; if(o?.dataset.p) $(".c-pv",r).value=o.dataset.p; resumen(); };
    if(prodId){ $(".c-prod",r).value = prodId; $(".c-prod",r).onchange({target:$(".c-prod",r)}); }
    $(".c-cant",r).oninput = $(".c-cost",r).oninput = resumen;
    $(".x",r).onclick = () => { if(box.children.length>1){ r.remove(); resumen(); } };
    resumen();
  };
  agregar();
  $("#caddp").onclick = () => agregar();
  $("#cnewp").onclick = () => { $("#cnewbox").hidden = false; $("#cnn").focus(); };
  $("#cnc").onclick = () => { $("#cnewbox").hidden = true; };
  $("#cnok").onclick = async () => { const nombre = $("#cnn").value.trim(); if(!nombre) return toast("Escribí el nombre del producto.");
    const { data: np, error } = await sb.from("productos").insert({ nombre, linea: $("#cnl").value }).select("id,codigo,nombre,linea").single();
    if(error) return fail(error.code==="23505"?"Ya existe un producto con ese nombre en esa línea":error);
    const opt = `<option value="${np.id}" data-c="" data-p="">${esc(cod6(np.codigo)+" · "+np.nombre)}</option>`;
    box.querySelectorAll(".c-prod").forEach(sel => sel.querySelector(`optgroup[label="${np.linea}"]`)?.insertAdjacentHTML("beforeend", opt));
    opciones = opciones.replace(`<optgroup label="${np.linea}">`, `<optgroup label="${np.linea}">`+opt);
    const vacia = [...box.querySelectorAll(".c-prod")].find(sel=>!sel.value);
    if(vacia) vacia.value = np.id; else agregar(np.id);
    $("#cnn").value = ""; $("#cnewbox").hidden = true; cache.productos = null; toast(`Producto registrado con el código ${cod6(np.codigo)}`); };
  $("#fc [name=fecha]").onchange = e => { box.querySelectorAll(".c-vto").forEach(i=>{ if(!i.dataset.tocado) i.value = sumarMeses(e.target.value||hoy(),6); }); };
  $("#lprev").onchange = e => { $("#lprevbox").hidden = !e.target.checked; $("#lnum").textContent = e.target.checked ? "L-0___" : lote4(proximo); if(e.target.checked) $("#lprevnum").focus(); };
  $("#lprevnum").oninput = e => { const n=+e.target.value; $("#lnum").textContent = n>0&&n<200 ? lote4(n) : "L-0___"; };
  $("#fc").onsubmit = async e => { e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    let numero = null;
    if($("#lprev").checked){ numero = +$("#lprevnum").value; if(!(numero>0 && numero<200)) return toast("El lote anterior tiene que ser un número entre 1 y 199."); }
    const items = [];
    for(const r of box.querySelectorAll(".citem")){
      const venc = mmaaAFecha($(".c-vto",r).value); if(!venc) return toast("Revisá el vencimiento: tiene que ser MM/AA, por ejemplo 04/27.");
      const cant = +$(".c-cant",r).value; if(!(cant>=1 && Number.isInteger(cant))) return toast("La cantidad tiene que ser un número entero.");
      if(!$(".c-prod",r).value) return toast("Elegí el producto en cada renglón (o quitá el renglón vacío).");
      items.push({ producto_id: $(".c-prod",r).value, cantidad: cant, costo_unitario: $(".c-cost",r).value || null, precio_venta: $(".c-pv",r).value || null, vencimiento: venc, actualizar_costo: $("#cupd").checked });
    }
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
    const { data, error } = await sb.rpc("registrar_compra", { p_fecha: f.fecha, p_proveedor: f.proveedor.trim(), p_factura: f.nro_factura || null, p_numero: numero, p_items: items });
    btn.disabled = false; if(error) return fail(error);
    cache.productos = null; toast(`Compra guardada en el lote ${lote4(data.numero)}`); render(); modalEtiquetas(data.id);
  };
}

/* Etiquetas: hoja A4 de 21 (63,5 × 38,1 mm) o rollo de 50 × 30 mm */
async function modalEtiquetas(loteId){
  const { data: us, error } = await sb.from("v_unidades").select("*").eq("lote_id", loteId).order("producto").order("nro"); if(error) return fail(error);
  if(!us.length) return toast("Ese lote no tiene unidades.");
  let formato = "a4"; try{ formato = localStorage.getItem("etqFormato") || "a4"; }catch(e){}
  abrirModal(`Etiquetas del lote ${us[0].lote}`, `<div class="fields">
      <label class="f">Formato<select id="efmt"><option value="a4">Hoja A4 · 21 etiquetas (63,5 × 38,1 mm)</option><option value="rollo">Rollo de etiquetas 50 × 30 mm</option></select></label>
      <label class="f" id="eskipbox">Empezar en la etiqueta n° (si la hoja ya está usada)<input id="eskip" type="number" min="1" max="21" value="1" inputmode="numeric"></label>
      <label class="f">Qué imprimir<select id="equal"><option value="todas">Todas (${us.length})</option><option value="disp">Solo las que están en stock (${us.filter(u=>u.estado==="Disponible").length})</option></select></label></div>
    <p class="muted">Vista previa:</p><div id="eprev" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px"></div>
    <div class="row"><button class="btn pri right" id="eprint">Imprimir</button></div>`);
  $("#efmt").value = formato;
  const lista = () => $("#equal").value==="disp" ? us.filter(u=>u.estado==="Disponible") : us;
  const prev = () => { formato = $("#efmt").value; $("#eskipbox").hidden = formato!=="a4"; try{ localStorage.setItem("etqFormato", formato); }catch(e){}
    $("#eprev").innerHTML = lista().slice(0,6).map(u=>`<div class="etq etq-${formato}" style="border:1px dashed var(--line);background:#fff">${etiquetaHTML(u)}</div>`).join("") + (lista().length>6?`<span class="muted" style="align-self:center">+ ${lista().length-6} más</span>`:""); };
  ["efmt","equal"].forEach(id=>$("#"+id).onchange=prev); prev();
  $("#eprint").onclick = () => imprimirEtiquetas(lista(), formato, formato==="a4" ? Math.max(0,(+$("#eskip").value||1)-1) : 0);
}
function etiquetaHTML(u){
  return `<img src="logo.png" alt=""><div class="etq-t"><div class="etq-n">${esc(u.producto)}</div><div class="etq-l">Lote <b>${esc(u.lote)}</b></div><div class="etq-c">${esc(u.codigo_corto)}</div>${u.vencimiento?`<div class="etq-v">Vto. ${mmaa(u.vencimiento)}</div>`:""}</div>`;
}
function imprimirEtiquetas(lista, formato, saltear){
  let zona = document.getElementById("print"); if(!zona){ zona = document.createElement("div"); zona.id = "print"; document.body.appendChild(zona); }
  zona.className = "print-" + formato;
  zona.innerHTML = Array(saltear).fill(`<div class="etq etq-${formato}"></div>`).join("") + lista.map(u=>`<div class="etq etq-${formato}">${etiquetaHTML(u)}</div>`).join("");
  let st = document.getElementById("pagestyle"); if(!st){ st = document.createElement("style"); st.id = "pagestyle"; document.head.appendChild(st); }
  st.textContent = formato==="a4" ? "@page{size:A4;margin:15.1mm 7.2mm}" : "@page{size:50mm 30mm;margin:0}";
  const imgs = [...zona.querySelectorAll("img")];
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => {
    document.body.classList.add("printing"); setTimeout(() => { window.print(); setTimeout(()=>document.body.classList.remove("printing"), 500); }, 50);
  });
}

/* Entrega de productos a un paciente: código 000097-02 = producto 000097, 2 unidades (lotes más antiguos primero) */
async function modalEntrega(paciente){
  const prods = (await catalogo("productos", true)).filter(x=>x.activo);
  const porCodigo = Object.fromEntries(prods.map(p=>[p.codigo, p]));
  const disp = {};   // producto_id -> unidades disponibles en orden de baja
  const cargarDisp = async pid => { if(!disp[pid]){ const { data } = await sb.from("v_unidades").select("id,codigo,codigo_corto,lote,lote_numero,nro,vencimiento").eq("producto_id",pid).eq("estado","Disponible").order("lote_numero").order("nro"); disp[pid] = data||[]; } return disp[pid]; };
  let pac = paciente; const lineas = [];
  abrirModal("Entrega de producto", `<form id="fe" class="grid">
    <div id="epac"></div>
    <div class="fields"><label class="f">Fecha<input name="fecha" type="date" required value="${hoy()}"></label></div>
    <div class="card" style="background:var(--accent-soft);border-color:transparent">
      <label class="f">Código del producto<div class="row" style="flex-wrap:nowrap"><input id="ecod" placeholder="000097-02  (código - cantidad)" autocomplete="off" inputmode="text" autocapitalize="characters" style="font-family:ui-monospace,Menlo,monospace;font-size:18px"><button type="button" class="btn pri" id="eadd">Agregar</button></div></label>
      <p class="muted" style="margin:6px 0 0;font-size:13px">Escribí el código de 6 cifras y la cantidad (ej. <b>000097-02</b> son 2 unidades). Para una unidad puntual, escribí la etiqueta completa (ej. <b>L-0200 000097-01</b>). También podés elegirlo de la lista:</p>
      <select id="esel" style="margin-top:8px"><option value="">— elegir producto de la lista —</option>${["Funcional","Estética"].map(l=>`<optgroup label="${l}">`+prods.filter(x=>x.linea===l).map(x=>`<option value="${x.codigo}">${esc(prodLabel(x))} · stock ${x.stock_actual}</option>`).join("")+`</optgroup>`).join("")}</select>
      <div id="emsg" style="color:var(--bad);font-weight:600;margin-top:6px"></div></div>
    <div id="elin"></div>
    <label class="f">Observación (opcional)<input name="obs"></label>
    <div class="row"><b>Total: <span id="etot">$ 0</span></b><button class="btn pri right" type="submit" id="eok">Registrar entrega</button></div></form>`);
  const pintaPac = () => {
    if(pac){ $("#epac").innerHTML = `<div class="row"><div><div class="muted" style="font-size:13px;font-weight:600">PACIENTE</div><b style="font-size:18px">${esc(pac.nombre)}</b></div>${paciente?"":`<button type="button" class="btn ghost right" id="ecamb">Cambiar</button>`}</div>`; if(!paciente) $("#ecamb").onclick=()=>{ pac=null; pintaPac(); }; return; }
    $("#epac").innerHTML = `<label class="f">Paciente<div class="search">${ICON.search}<input id="epq" placeholder="Buscar por apellido, nombre o DNI" autocomplete="off"></div></label><div id="epr"></div>`;
    let t; $("#epq").oninput = () => { clearTimeout(t); t=setTimeout(async()=>{ const q=$("#epq").value.trim().replace(/[%,()]/g,""); if(q.length<2){ $("#epr").innerHTML=""; return; }
      const { data } = await sb.from("pacientes").select("id,nombre,dni").or(`nombre.ilike.%${q}%,dni.ilike.%${q}%`).order("nombre").limit(8);
      $("#epr").innerHTML = `<div class="card tight">${data.length?`<ul class="list">${data.map(p=>`<li><button type="button" class="item" style="width:100%;border:none;background:none;text-align:left;cursor:pointer" data-p="${p.id}"><div class="main"><div class="t">${esc(p.nombre)}</div><div class="s">${p.dni?"DNI "+esc(p.dni):""}</div></div></button></li>`).join("")}</ul>`:`<div class="empty">Sin resultados.</div>`}</div>`;
      $("#epr").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ pac=data.find(x=>x.id===b.dataset.p); pintaPac(); $("#ecod").focus(); }); },250); };
    $("#epq").focus();
  };
  pintaPac();
  const msg = t => { $("#emsg").textContent = t||""; };
  const asignacion = () => { // simula la baja igual que el servidor
    const usadas = new Set(); lineas.forEach(l=>l.pedidas.forEach(c=>usadas.add(c)));
    return lineas.map(l => { const libres = disp[l.prod.id].filter(u=>!usadas.has(u.codigo) && !l.pedidas.includes(u.codigo));
      const fifo = libres.slice(0, Math.max(0, l.cantidad - l.pedidas.length)); fifo.forEach(u=>usadas.add(u.codigo));
      const total = disp[l.prod.id].length - lineas.filter(o=>o!==l && o.prod.id===l.prod.id).reduce((a,o)=>a+o.cantidad,0);
      return { unidades: [...l.pedidas.map(c=>disp[l.prod.id].find(u=>u.codigo===c)), ...fifo], falta: l.cantidad - l.pedidas.length - fifo.length, quedan: total }; });
  };
  const pintar = () => {
    const asg = asignacion(); let tot = 0, hayFalta = false;
    $("#elin").innerHTML = lineas.length ? `<div class="card tight"><div class="tablewrap"><table><thead><tr><th>Producto</th><th class="num">Cant.</th><th>Unidades que se dan de baja</th><th class="num">Importe $</th><th></th></tr></thead><tbody>${lineas.map((l,i)=>{ tot += Number(l.monto||0); if(asg[i].falta>0) hayFalta = true;
      return `<tr><td><code>${l.prod.codigo_txt}</code><br><b>${esc(l.prod.nombre)}</b></td><td class="num"><input type="number" min="1" step="1" value="${l.cantidad}" data-q="${i}" style="width:70px;text-align:right"></td>
        <td style="font-size:13px">${asg[i].unidades.map(u=>`<code>${esc(u.codigo)}</code>${u.vencimiento?` <span class="muted">vto ${mmaa(u.vencimiento)}</span>`:""}`).join("<br>")}${asg[i].falta>0?`<div style="color:var(--bad);font-weight:600">Stock insuficiente: faltan ${asg[i].falta}</div>`:""}</td>
        <td class="num"><input type="number" step="any" inputmode="decimal" value="${l.monto??""}" data-m="${i}" style="width:110px;text-align:right"></td><td><button type="button" class="iconbtn" data-x="${i}">×</button></td></tr>`; }).join("")}</tbody></table></div></div>` : `<p class="muted" style="margin:0">Todavía no agregaste productos.</p>`;
    $("#etot").textContent = pesos(tot); $("#eok").disabled = !lineas.length || hayFalta;
    $("#elin").querySelectorAll("[data-q]").forEach(inp=>inp.onchange=()=>{ const l=lineas[+inp.dataset.q]; const n=Math.max(1,Math.floor(+inp.value||1)); l.cantidad=Math.max(n,l.pedidas.length); if(!l.montoTocado) l.monto = l.prod.precio!=null ? l.prod.precio*l.cantidad : l.monto; pintar(); });
    $("#elin").querySelectorAll("[data-m]").forEach(inp=>inp.oninput=()=>{ const l=lineas[+inp.dataset.m]; l.monto = inp.value; l.montoTocado = true; let t=0; lineas.forEach(x=>t+=Number(x.monto||0)); $("#etot").textContent=pesos(t); });
    $("#elin").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ lineas.splice(+b.dataset.x,1); pintar(); });
  };
  const agregarLinea = async (prod, cant, codigoUnidad) => {
    await cargarDisp(prod.id);
    let l = lineas.find(x=>x.prod.id===prod.id);
    if(!l){ l = { prod, cantidad: 0, pedidas: [], monto: null, montoTocado: false }; lineas.push(l); }
    if(codigoUnidad){ if(l.pedidas.includes(codigoUnidad)){ msg("Esa unidad ya está en la lista."); return; } l.pedidas.push(codigoUnidad); l.cantidad = Math.max(l.cantidad + 1, l.pedidas.length); }
    else l.cantidad += cant;
    if(!l.montoTocado) l.monto = prod.precio!=null ? prod.precio*l.cantidad : null;
    msg(""); pintar();
  };
  const procesar = async () => {
    const t = $("#ecod").value.trim().toUpperCase(); if(!t) return;
    let m = t.match(/^L-?\s*(\d{1,4})\s+(\d{1,6})-(\d{1,3})$/);
    if(m){ const prod = porCodigo[+m[2]]; if(!prod) return msg(`No existe el producto ${cod6(m[2])}.`);
      const u = (await cargarDisp(prod.id)).find(x=>x.lote_numero===+m[1] && x.nro===+m[3]);
      if(!u) return msg(`La unidad ${lote4(+m[1])} ${cod6(m[2])}-${String(+m[3]).padStart(2,"0")} no está disponible (no existe, ya se entregó o se descartó).`);
      await agregarLinea(prod, 1, u.codigo); $("#ecod").value = ""; return; }
    m = t.match(/^(\d{1,6})(?:\s*-\s*(\d{1,2}))?$/);
    if(!m) return msg("Formato no reconocido. Usá 000097-02 o L-0200 000097-01.");
    const prod = porCodigo[+m[1]]; if(!prod) return msg(`No existe el producto ${cod6(m[1])}.`);
    const cant = m[2] ? +m[2] : 1; if(cant<1) return msg("La cantidad tiene que ser 1 o más.");
    await agregarLinea(prod, cant); $("#ecod").value = ""; $("#ecod").focus();
  };
  $("#eadd").onclick = procesar;
  $("#ecod").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); procesar(); } };
  $("#esel").onchange = async e => { const p = porCodigo[+e.target.value]; e.target.value=""; if(p) await agregarLinea(p, 1); };
  pintar();
  $("#fe").onsubmit = async e => { e.preventDefault();
    if(!pac) return toast("Elegí el paciente."); if(!lineas.length) return toast("Agregá al menos un producto.");
    const f = Object.fromEntries(new FormData(e.target));
    const items = lineas.map(l=>({ producto_id: l.prod.id, cantidad: l.cantidad, monto: Number(l.monto||0), unidades: l.pedidas }));
    $("#eok").disabled = true;
    const { error } = await sb.rpc("registrar_entrega", { p_paciente: pac.id, p_fecha: f.fecha, p_area: areaDeLineas(lineas.map(l=>l.prod.linea)), p_obs: f.obs || null, p_items: items });
    $("#eok").disabled = false; if(error) return fail(error);
    cerrarModal(); cache.productos = null; toast(`Entrega registrada · ${lineas.reduce((a,l)=>a+l.cantidad,0)} unidades dadas de baja`);
    if(paciente) render(); else location.hash = `#/p/${pac.id}/visitas`;
  };
  if(pac) $("#ecod").focus();
}

/* ---------- FACTURACIÓN ---------- */
async function vFacturacion(v){
  let all=[], from=0; while(true){ const { data, error } = await sb.from("v_visitas").select("fecha,area,total").range(from, from+999); if(error) throw error; all=all.concat(data); if(data.length<1000) break; from+=1000; }
  const meses = {}; all.forEach(x=>{ const m=x.fecha.slice(0,7); const o=(meses[m]??={tot:0,est:0,fun:0,amb:0,n:0}); const t=Number(x.total||0); o.tot+=t; o.n++; if(x.area==="Estética") o.est+=t; else if(x.area==="Funcional") o.fun+=t; else o.amb+=t; });
  const keys = Object.keys(meses).sort().reverse(); const max = Math.max(...keys.map(k=>meses[k].tot),1);
  v.innerHTML = `<h1>Facturación</h1><p class="sub">Total por mes y por área, desde las visitas cargadas (incluye la facturación histórica de Notion).</p>
    <div class="card tight"><div class="tablewrap"><table><thead><tr><th>Mes</th><th class="num">Visitas</th><th class="num">Estética</th><th class="num">Funcional</th><th class="num">Ambas / otros</th><th class="num">Total</th><th style="width:22%"></th></tr></thead><tbody>${keys.map(k=>{const o=meses[k];const [y,m]=k.split("-");return `<tr><td><b>${MESES[+m-1]} ${y}</b></td><td class="num">${o.n}</td><td class="num">${pesos(o.est)}</td><td class="num">${pesos(o.fun)}</td><td class="num muted">${pesos(o.amb)}</td><td class="num"><b>${pesos(o.tot)}</b></td><td><div class="bar"><span style="width:${(o.tot/max*100).toFixed(1)}%"></span></div></td></tr>`}).join("")}</tbody></table></div></div>`;
}

/* ---------- CATÁLOGOS ---------- */
async function vAjustes(v){
  const [trats, dets] = await Promise.all([catalogo("tratamientos",true), catalogo("determinaciones",true)]);
  v.innerHTML = `<h1>Catálogos</h1><p class="sub">Tratamientos con su precio y rangos de laboratorio. Lo que cargues acá se usa en las visitas y en el estado de cada análisis.</p>
    <div class="tabs"><button class="tab on" data-c="t">Tratamientos</button><button class="tab" data-c="d">Rangos de laboratorio</button></div><div id="cc"></div>`;
  const pintaT = () => { $("#cc").innerHTML = `<div class="row" style="margin-bottom:10px"><button class="btn pri right" id="bnt">+ Tratamiento</button></div><div class="card tight">${trats.length?`<ul class="list">${trats.map(t=>`<li><button class="item" style="width:100%;border:none;background:none;text-align:left;cursor:pointer" data-t="${t.id}"><div class="main"><div class="t">${esc(t.nombre)}${t.activo?"":" <span class='pill s-none'>inactivo</span>"}</div><div class="s">${esc(t.categoria||"")}</div></div>${areaPill(t.area)}<div class="r">${pesos(t.precio)}</div></button></li>`).join("")}</ul>`:`<div class="empty">Cargá los tratamientos que hace (facial, PRP, sueroterapia…) con su precio. Así al cargar una visita se completan solos.</div>`}</div>`;
    $("#bnt").onclick=()=>modalTrat({}); $("#cc").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>modalTrat(trats.find(x=>x.id===b.dataset.t))); };
  const pintaD = () => { $("#cc").innerHTML = `<p class="muted">Tocá una determinación para cargar el rango de referencia y el óptimo funcional. Si es distinto para hombres, completá también esos campos.</p><div class="card tight"><div class="tablewrap"><table><thead><tr><th>Determinación</th><th>Unidad</th><th>Referencia</th><th>Óptimo</th><th>Hombres</th><th></th></tr></thead><tbody>${dets.map(d=>`<tr><td><b>${esc(d.nombre)}</b><div class="muted" style="font-size:12.5px">${esc(d.grupo)}</div></td><td>${esc(d.unidad||"")}</td><td>${d.ref_min!=null||d.ref_max!=null?`${d.ref_min??"…"}–${d.ref_max??"…"}`:'<span class="muted">—</span>'}</td><td>${d.opt_min!=null||d.opt_max!=null?`${d.opt_min??"…"}–${d.opt_max??"…"}`:'<span class="muted">—</span>'}</td><td class="muted">${[d.ref_min_h,d.ref_max_h,d.opt_min_h,d.opt_max_h].some(x=>x!=null)?"sí":""}</td><td><button class="btn ghost" data-d="${d.id}">Editar</button></td></tr>`).join("")}</tbody></table></div></div>`;
    $("#cc").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>modalDet(dets.find(x=>x.id===b.dataset.d))); };
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ document.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x===b)); b.dataset.c==="t"?pintaT():pintaD(); });
  pintaT();
}
function modalTrat(t){
  const nuevo=!t.id;
  abrirModal(nuevo?"Nuevo tratamiento":"Editar tratamiento", `<form id="ft" class="fields">
    <label class="f wide">Nombre<input name="nombre" required value="${esc(t.nombre)}"></label>
    <label class="f">Área<select name="area">${["Estética","Funcional"].map(a=>`<option ${t.area===a?"selected":""}>${a}</option>`).join("")}</select></label>
    <label class="f">Categoría<input name="categoria" list="catl" value="${esc(t.categoria)}"><datalist id="catl">${["Facial","Corporal","Inyectable","Sueroterapia","Consulta","Capilar"].map(c=>`<option>${c}</option>`).join("")}</datalist></label>
    <label class="f">Precio $<input name="precio" type="number" step="any" value="${t.precio??""}"></label>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="activo" ${t.activo===false?"":"checked"} style="width:auto;min-height:0"> Activo</label>
    <div class="wide row"><button class="btn pri right">Guardar</button></div></form>`);
  $("#ft").onsubmit = async e => { e.preventDefault(); const d=Object.fromEntries(new FormData(e.target)); d.activo=!!d.activo; for(const k in d) if(d[k]==="") d[k]=null;
    const r = nuevo ? await sb.from("tratamientos").insert(d) : await sb.from("tratamientos").update(d).eq("id",t.id); if(r.error) return fail(r.error); cerrarModal(); toast("Tratamiento guardado"); cache.tratamientos=null; render(); };
}
function modalDet(d){
  const campo=(k,l)=>`<label class="f">${l}<input name="${k}" type="number" step="any" value="${d[k]??""}"></label>`;
  abrirModal(d.nombre, `<form id="fd" class="fields">
    <label class="f">Unidad<input name="unidad" value="${esc(d.unidad)}"></label><div></div>
    ${campo("ref_min","Referencia mín.")}${campo("ref_max","Referencia máx.")}${campo("opt_min","Óptimo mín.")}${campo("opt_max","Óptimo máx.")}
    <h3 class="wide">Solo si es distinto para hombres</h3>
    ${campo("ref_min_h","Referencia mín. (H)")}${campo("ref_max_h","Referencia máx. (H)")}${campo("opt_min_h","Óptimo mín. (H)")}${campo("opt_max_h","Óptimo máx. (H)")}
    <label class="f wide">Notas<input name="notas" value="${esc(d.notas)}"></label>
    <div class="wide row"><button class="btn pri right">Guardar</button></div></form>`);
  $("#fd").onsubmit = async e => { e.preventDefault(); const x=Object.fromEntries(new FormData(e.target)); for(const k in x) if(x[k]==="") x[k]=null; x.rangos_revisados=true;
    const { error } = await sb.from("determinaciones").update(x).eq("id",d.id); if(error) return fail(error); cerrarModal(); toast("Rangos guardados"); cache.determinaciones=null; render(); };
}

/* ---------- modales ---------- */
function abrirModal(titulo, html){
  cerrarModal();
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="mbg";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="modal-head"><h2 style="margin:0">${esc(titulo)}</h2><button class="iconbtn" id="mclose" aria-label="Cerrar">×</button></div>${html}</div>`;
  document.body.appendChild(bg); $("#mclose").onclick=cerrarModal; bg.onclick=e=>{ if(e.target===bg) cerrarModal(); };
  setTimeout(()=>{ const f=bg.querySelector("input:not([type=checkbox]),select"); if(f && window.innerWidth>820) f.focus(); },50);
}
function cerrarModal(){ $("#mbg")?.remove(); }
function confirmar(msg){ return new Promise(res=>{ const bg=document.createElement("div"); bg.className="modal-bg"; bg.style.zIndex=60;
  bg.innerHTML=`<div class="modal" style="max-width:420px"><p style="font-weight:600">${esc(msg)}</p><div class="row"><button class="btn right" id="cno">Cancelar</button><button class="btn pri" id="csi">Sí, eliminar</button></div></div>`;
  document.body.appendChild(bg); $("#cno",bg).onclick=()=>{bg.remove();res(false)}; $("#csi",bg).onclick=()=>{bg.remove();res(true)}; }); }

/* ---------- arranque ---------- */
let enRecuperacion = false;
/* Importante: no llamar a Supabase dentro del callback de auth (bloquea la sesión guardada y deja la pantalla en blanco).
   Por eso el trabajo se difiere con setTimeout. */
let arrancando = false;
async function arrancar(s){
  if(arrancando) return; arrancando = true;
  try{
    session = s;
    if(!session) return pantallaLogin();
    $("#root").innerHTML = `<div class="login"><div class="brand">Eternal Secret<small>Cargando…</small></div></div>`;
    await verificarAcceso();
    if(!autorizado) return pantallaSinPermiso();
    await contarAlertas(); shell(); render();
  }catch(e){ console.error(e); pantallaLogin("No se pudo conectar. Revisá internet y volvé a intentar."); }
  finally{ arrancando = false; }
}
sb.auth.onAuthStateChange((ev, s) => {
  if(ev==="PASSWORD_RECOVERY"){ enRecuperacion=true; session=s; setTimeout(pantallaNuevaClave,0); return; }
  if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT"){
    if(enRecuperacion) return;
    if(ev==="SIGNED_IN" && session && s && session.user.id===s.user.id && $("#view")) { session=s; return; } // al volver a la app no recargar todo
    setTimeout(()=>arrancar(s),0);
  }
});
// Red de seguridad: si en 6 segundos no apareció nada, mostrar el login
setTimeout(()=>{ if(!$("#root").innerHTML.trim()) pantallaLogin(); },6000);
</script>
